name: Heart Disease MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Lint Code with Flake8
        run: |
          # Fail the build if there are Python syntax errors or undefined names
          flake8 src/ api/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check style and formatting (max line length 120)
          flake8 src/ api/ tests/ --count --max-line-length=120 --ignore=E203,W503 --statistics

      - name: 5. Run Data Ingestion, Preprocessing & Model Training
        run: |
          python src/data_ingestion.py
          python src/preprocess.py
          python -m src.train

      - name: 6. Execute Unit & API Tests with Pytest
        run: |
          pytest tests/ -v --junitxml=pytest_report.xml

      - name: 7. Upload Trained Model & Evaluation Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlops-pipeline-artifacts
          path: |
            models/
            reports/screenshots/
            pytest_report.xml
          retention-days: 14